# Gate PM2 startup on RabbitMQ and Redis being reachable.
#
# Originally required: user and mail connected to RabbitMQ once at startup and
# never retried, so when PM2 started ~40s before the broker at boot, OTP email
# was silently dead until a manual restart.
#
# Both services now retry with backoff, so this is no longer load-bearing — but
# it is kept because it removes a pointless retry cycle on every reboot and
# makes startup deterministic rather than racing the broker.
[Unit]
After=rabbitmq-server.service redis-server.service network-online.target
Wants=rabbitmq-server.service redis-server.service network-online.target

[Service]
ExecStartPre=/bin/bash -c "for i in $(seq 1 60); do (echo > /dev/tcp/127.0.0.1/5672) >/dev/null 2>&1 && exit 0; sleep 2; done; echo \"rabbitmq never came up\" >&2; exit 1"
