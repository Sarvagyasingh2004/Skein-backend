# Skein reverse proxy.
# Installed as plain HTTP; Certbot rewrites this in place to add TLS,
# the :443 blocks and the HTTP->HTTPS redirect.
#
# Two hostnames rather than one host with path prefixes: the Socket.IO client
# treats a path in its connect URL as a NAMESPACE, so https://host/chat would
# silently never connect.

# "upgrade" for websockets, "close" for everything else. Hardcoding
# `Connection: upgrade` breaks keep-alive on ordinary REST calls.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# ---------------------------------------------------------------- user service
server {
    server_name skein-user.duckdns.org;

    access_log /var/log/nginx/skein-user.access.log;
    error_log  /var/log/nginx/skein-user.error.log;

    client_max_body_size 2m;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/skein-user.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/skein-user.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# ---------------------------------------------------------------- chat service
server {
    server_name skein-chat.duckdns.org;

    access_log /var/log/nginx/skein-chat.access.log;
    error_log  /var/log/nginx/skein-chat.error.log;

    # Chat uploads images via multer -> Cloudinary. Nginx defaults to 1m, which
    # rejects most phone photos with a 413 before Express ever sees them.
    client_max_body_size 15m;
    server_tokens off;

    # Socket.IO needs its own block so the long read timeout does not apply to
    # the REST API.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache     off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/skein-user.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/skein-user.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = skein-user.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name skein-user.duckdns.org;
    return 404; # managed by Certbot


}
server {
    if ($host = skein-chat.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name skein-chat.duckdns.org;
    return 404; # managed by Certbot


}